<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-STOCK</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <span>A-<span class="highlight">STOCK</span></span>
            </div>

            <!-- Checkbox Trick + Hamburger -->
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <!-- Menu -->
            <div class="nav-menu">
                <a href="/" class="nav-link active">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="/data" class="nav-link">
                    <i class="fas fa-database"></i>
                    <span>Data</span>
                </a>
                <a href="/model" class="nav-link">
                    <i class="fas fa-cogs"></i>
                    <span>Model</span>
                </a>
                <a href="/predict" class="nav-link">
                    <i class="fas fa-magic"></i>
                    <span>Predict</span>
                </a>
                <a href="/history" class="nav-link">
                    <i class="fas fa-history"></i>
                    <span>History</span>
                </a>
            </div>

        </div>
    </nav>

    <!-- Main Content Home -->
    <main class="home-main">
        <div class="home-container">

            <!-- Slideshow Gambar -->
            <div class="home-slideshow">
                <div class="slides" id="slides">
                    <img src="https://picsum.photos/id/1015/800/500" alt="Dashboard 1" class="slide active">
                    <img src="https://picsum.photos/id/201/800/500" alt="Dashboard 2" class="slide">
                    <img src="https://picsum.photos/id/237/800/500" alt="Dashboard 3" class="slide">
                    <img src="https://picsum.photos/id/870/800/500" alt="Dashboard 4" class="slide">
                </div>
            </div>

            <!-- Nama & NIM (di bawah gambar) -->
            <div class="home-user-info">
                <h2>Nadiyah Shofa Salsabila</h2>
                <p>NIM : 221111320</p> <!-- Ganti dengan NIM kamu -->
            </div>

            <!-- Tombol START -->
            <div class="home-start-container">
                <button onclick="startPrediction()" class="home-start-btn">
                    START
                </button>
            </div>

        </div>
    </main>

    <script>
        // Slideshow otomatis (4 detik)
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        setInterval(nextSlide, 4000);

        // Fungsi START → Redirect ke predict.html
        function startPrediction() {
            window.location.href = "predict.html";
        }

        // Tampilkan slide pertama
        window.onload = () => {
            showSlide(0);
        };
    </script>
</body>


</html>
